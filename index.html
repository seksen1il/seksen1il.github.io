!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plaka → İl</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --asphalt: #1b1d1f;
    --asphalt-2: #26292c;
    --plate-white: #f4f6f2;
    --plate-blue: #0033a0;
    --plate-yellow: #ffd400;
    --line: #3a3d40;
    --ok: #2fae66;
    --err: #d94b3f;
    --text-dim: #9a9d9f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,0.015) 2px 4px),
      var(--asphalt);
    color:var(--plate-white);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px 60px;
  }

  header{
    width:100%;
    max-width:520px;
    text-align:left;
    margin-bottom:18px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  header .tag{
    background:var(--plate-yellow);
    color:#111;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:11px;
    padding:2px 7px;
    border-radius:3px;
    letter-spacing:.03em;
  }
  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:30px;
    letter-spacing:.01em;
    margin:0;
    line-height:1;
  }

  .card{
    width:100%;
    max-width:520px;
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }

  .video-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4/3;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    transition:border-color .25s ease;
  }
  video, canvas.overlay-canvas{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .frame-guide{
    position:absolute;
    left:5%;
    right:5%;
    top:34%;
    height:32%;
    border:2px dashed rgba(255,212,0,0.85);
    border-radius:6px;
    pointer-events:none;
  }
  .frame-guide::after{
    content:"plakayı bu alana hizala, mavi TR şeridi çerçeve dışında kalsın";
    position:absolute;
    bottom:-34px;
    left:0;
    right:0;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--text-dim);
    line-height:1.4;
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    border:none;
    border-radius:9px;
    padding:13px 16px;
    cursor:pointer;
    flex:1;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{ transform:scale(0.97); }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .btn-primary{ background:var(--plate-yellow); color:#111; }
  .btn-secondary{ background:transparent; color:var(--plate-white); border:1px solid var(--line); }
  .btn-secondary:hover{ border-color:#5a5d60; }

  .status{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-top:10px;
    min-height:16px;
  }

  .manual-row{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .manual-row input{
    flex:1;
    background:var(--asphalt);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--plate-white);
    font-family:'Space Mono', monospace;
    font-size:16px;
    letter-spacing:.04em;
    padding:11px 12px;
    text-transform:uppercase;
  }
  .manual-row input:focus{ outline:2px solid var(--plate-yellow); outline-offset:-1px; }
  .manual-row button{ flex:0 0 auto; padding:11px 18px; }

  /* Result */
  .result{
    width:100%;
    max-width:520px;
    display:none;
  }
  .result.show{ display:block; }

  .plate-render{
    display:flex;
    background:var(--plate-white);
    border-radius:8px;
    overflow:hidden;
    border:2px solid #1a1a1a;
    margin-bottom:14px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .plate-eu{
    background:var(--plate-blue);
    color:var(--plate-white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:13px;
    width:34px;
    flex-shrink:0;
  }
  .plate-text{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:clamp(22px, 6.5vw, 34px);
    color:#111;
    letter-spacing:.06em;
    padding:10px 8px;
  }

  .province-block{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--asphalt-2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
  }
  .province-code{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:26px;
    color:var(--plate-yellow);
    background:var(--asphalt);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    min-width:50px;
    text-align:center;
  }
  .province-name{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:26px;
  }
  .province-region{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:2px;
  }

  .error-block{
    background:rgba(217,75,63,0.12);
    border:1px solid var(--err);
    color:#f2a79e;
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.4;
  }

  canvas.capture-canvas{ display:none; }

  footer{
    max-width:520px;
    text-align:center;
    color:var(--text-dim);
    font-size:11.5px;
    margin-top:8px;
    line-height:1.5;
  }

  .spinner{
    width:14px; height:14px;
    border:2px solid var(--text-dim);
    border-top-color:var(--plate-yellow);
    border-radius:50%;
    display:inline-block;
    animation:spin .7s linear infinite;
    vertical-align:middle;
    margin-right:6px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Plaka → İl</h1>
  <span class="tag">TR 01–81</span>
</header>

<div class="card">
  <div class="video-wrap" id="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div class="frame-guide"></div>
  </div>

  <div class="controls">
    <button class="btn-primary" id="startBtn" style="flex:1">Kamerayı başlat, otomatik tara</button>
  </div>
  <button class="btn-secondary" id="rescanBtn" style="display:none; width:100%; margin-top:10px;">Yeni plaka için taramayı sürdür</button>

  <div class="status" id="status"></div>

  <div class="manual-row">
    <input type="text" id="manualInput" placeholder="ör. 34 ABC 123" maxlength="14">
    <button class="btn-secondary" id="manualBtn">Sorgula</button>
  </div>
</div>

<div class="result" id="result">
  <div class="plate-render">
    <div class="plate-eu">TR</div>
    <div class="plate-text" id="plateText">—</div>
  </div>
  <div id="resultInner"></div>
</div>

<canvas class="capture-canvas" id="captureCanvas"></canvas>

<footer>
  Kamera açıldığında tarama otomatik başlar, elle çekim gerekmez.<br>
  Okuma tamamen cihazında yapılır, görüntü hiçbir sunucuya gönderilmez.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
const PROVINCES = {
"01":["Adana","Akdeniz"],"02":["Adıyaman","Güneydoğu Anadolu"],"03":["Afyonkarahisar","Ege"],
"04":["Ağrı","Doğu Anadolu"],"05":["Amasya","Karadeniz"],"06":["Ankara","İç Anadolu"],
"07":["Antalya","Akdeniz"],"08":["Artvin","Karadeniz"],"09":["Aydın","Ege"],
"10":["Balıkesir","Marmara"],"11":["Bilecik","Marmara"],"12":["Bingöl","Doğu Anadolu"],
"13":["Bitlis","Doğu Anadolu"],"14":["Bolu","Karadeniz"],"15":["Burdur","Akdeniz"],
"16":["Bursa","Marmara"],"17":["Çanakkale","Marmara"],"18":["Çankırı","İç Anadolu"],
"19":["Çorum","Karadeniz"],"20":["Denizli","Ege"],"21":["Diyarbakır","Güneydoğu Anadolu"],
"22":["Edirne","Marmara"],"23":["Elazığ","Doğu Anadolu"],"24":["Erzincan","Doğu Anadolu"],
"25":["Erzurum","Doğu Anadolu"],"26":["Eskişehir","İç Anadolu"],"27":["Gaziantep","Güneydoğu Anadolu"],
"28":["Giresun","Karadeniz"],"29":["Gümüşhane","Karadeniz"],"30":["Hakkari","Doğu Anadolu"],
"31":["Hatay","Akdeniz"],"32":["Isparta","Akdeniz"],"33":["Mersin","Akdeniz"],
"34":["İstanbul","Marmara"],"35":["İzmir","Ege"],"36":["Kars","Doğu Anadolu"],
"37":["Kastamonu","Karadeniz"],"38":["Kayseri","İç Anadolu"],"39":["Kırklareli","Marmara"],
"40":["Kırşehir","İç Anadolu"],"41":["Kocaeli","Marmara"],"42":["Konya","İç Anadolu"],
"43":["Kütahya","Ege"],"44":["Malatya","Doğu Anadolu"],"45":["Manisa","Ege"],
"46":["Kahramanmaraş","Akdeniz"],"47":["Mardin","Güneydoğu Anadolu"],"48":["Muğla","Ege"],
"49":["Muş","Doğu Anadolu"],"50":["Nevşehir","İç Anadolu"],"51":["Niğde","İç Anadolu"],
"52":["Ordu","Karadeniz"],"53":["Rize","Karadeniz"],"54":["Sakarya","Marmara"],
"55":["Samsun","Karadeniz"],"56":["Siirt","Güneydoğu Anadolu"],"57":["Sinop","Karadeniz"],
"58":["Sivas","İç Anadolu"],"59":["Tekirdağ","Marmara"],"60":["Tokat","Karadeniz"],
"61":["Trabzon","Karadeniz"],"62":["Tunceli","Doğu Anadolu"],"63":["Şanlıurfa","Güneydoğu Anadolu"],
"64":["Uşak","Ege"],"65":["Van","Doğu Anadolu"],"66":["Yozgat","İç Anadolu"],
"67":["Zonguldak","Karadeniz"],"68":["Aksaray","İç Anadolu"],"69":["Bayburt","Karadeniz"],
"70":["Karaman","İç Anadolu"],"71":["Kırıkkale","İç Anadolu"],"72":["Batman","Güneydoğu Anadolu"],
"73":["Şırnak","Güneydoğu Anadolu"],"74":["Bartın","Karadeniz"],"75":["Ardahan","Doğu Anadolu"],
"76":["Iğdır","Doğu Anadolu"],"77":["Yalova","Marmara"],"78":["Karabük","Karadeniz"],
"79":["Kilis","Güneydoğu Anadolu"],"80":["Osmaniye","Akdeniz"],"81":["Düzce","Karadeniz"]
};

const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const rescanBtn = document.getElementById('rescanBtn');
const statusEl = document.getElementById('status');
const captureCanvas = document.getElementById('captureCanvas');
const resultEl = document.getElementById('result');
const plateTextEl = document.getElementById('plateText');
const resultInner = document.getElementById('resultInner');
const manualInput = document.getElementById('manualInput');
const manualBtn = document.getElementById('manualBtn');
const videoWrap = document.getElementById('videoWrap');

let stream = null;
let worker = null;
let scanTimer = null;
let isScanning = false;
let isPaused = false;
let isProcessing = false;

function setStatus(html){ statusEl.innerHTML = html; }

startBtn.addEventListener('click', async () => {
  setStatus('Kameraya erişiliyor…');
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width:{ideal:1280}, height:{ideal:960} },
      audio:false
    });
    video.srcObject = stream;
    startBtn.textContent = 'Kamera açık, otomatik taranıyor';
    startBtn.disabled = true;
    setStatus('<span class="spinner"></span>Plakayı çerçeveye hizala, otomatik algılanacak…');
    isScanning = true;
    isPaused = false;
    scanTimer = setInterval(tryDetect, 1300);
  }catch(err){
    setStatus('Kameraya erişilemedi: cihaz izni reddedildi ya da desteklenmiyor. Elle giriş kullanabilirsin.');
  }
});

rescanBtn.addEventListener('click', () => {
  isPaused = false;
  rescanBtn.style.display = 'none';
  videoWrap.style.borderColor = '';
  setStatus('<span class="spinner"></span>Yeniden taranıyor…');
});

async function tryDetect(){
  if(!isScanning || isPaused || isProcessing) return;
  if(!video.videoWidth) return;
  isProcessing = true;

  const vw = video.videoWidth, vh = video.videoHeight;
  // Crop to the guide box region (matches the on-screen frame)
  const cropX = vw*0.05, cropY = vh*0.34, cropW = vw*0.90, cropH = vh*0.32;

  // Upscale 2x for sharper OCR input, then grayscale + contrast threshold
  const scale = 2;
  captureCanvas.width = cropW*scale;
  captureCanvas.height = cropH*scale;
  const ctx = captureCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW*scale, cropH*scale);
  preprocessCanvas(ctx, captureCanvas.width, captureCanvas.height);

  try{
    if(!worker){
      setStatus('<span class="spinner"></span>Okuma motoru yükleniyor (ilk seferde biraz sürer)…');
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',
        tessedit_pageseg_mode: '7'
      });
    }
    const { data } = await worker.recognize(captureCanvas);
    const raw = (data.text || '').toUpperCase();
    const found = handlePlateText(raw, true, true);
    if(found){
      isPaused = true;
      videoWrap.style.borderColor = 'var(--ok)';
      rescanBtn.style.display = 'block';
      setStatus('Plaka yakalandı.');
    }else if(isScanning && !isPaused){
      setStatus('<span class="spinner"></span>Taranıyor, plaka aranıyor…');
    }
  }catch(err){
    if(isScanning && !isPaused){
      setStatus('<span class="spinner"></span>Taranıyor… (bir kare atlandı)');
    }
  }finally{
    isProcessing = false;
  }
}

manualBtn.addEventListener('click', () => {
  const val = manualInput.value.toUpperCase();
  if(!val.trim()){ setStatus('Önce bir plaka yaz.'); return; }
  handlePlateText(val, false, false);
});
manualInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') manualBtn.click(); });

// Grayscale + contrast stretch, helps a lot with close-up / low-light plate shots
function preprocessCanvas(ctx, w, h){
  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  let min = 255, max = 0;
  const gray = new Uint8ClampedArray(w*h);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    gray[p] = g;
    if(g<min) min=g;
    if(g>max) max=g;
  }
  const range = Math.max(max-min, 1);
  for(let i=0, p=0; i<d.length; i+=4, p++){
    let v = ((gray[p]-min)/range)*255;
    v = v>140 ? 255 : (v<90 ? 0 : v); // push toward black/white for cleaner glyphs
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(imgData, 0, 0);
}

function handlePlateText(raw, fromOcr, silent){
  const cleaned = raw.replace(/[^A-Z0-9]/g, '');

  let code = null;
  if(fromOcr){
    // OCR text can have junk before the real code (e.g. the blue "TR" strip
    // getting read as letters). Look for the first 2-digit run, anywhere in
    // the string, followed by letters, that is ALSO a valid 01-81 code.
    const candidates = [...cleaned.matchAll(/(\d{2})(?=[A-Z])/g)].map(m => m[1]);
    code = candidates.find(c => PROVINCES[c]) || null;
    // fallback: any valid 2-digit code anywhere, even without trailing letters
    if(!code){
      const anyCandidates = [...cleaned.matchAll(/\d{2}/g)].map(m => m[0]);
      code = anyCandidates.find(c => PROVINCES[c]) || null;
    }
  }else{
    // Manual entry: trust the start of what the user typed
    const match = cleaned.match(/^(\d{2})/);
    code = match ? match[1] : null;
  }

  if(!code){
    if(!silent){
      setStatus('Geçerli bir plaka gibi görünmüyor, il kodu ile başlamalı (ör. 34...).');
      showError('İl kodu tespit edilemedi. Plaka 2 haneli bir il koduyla başlamalı, ör. "34 ABC 123".');
    }
    return false;
  }

  const info = PROVINCES[code];

  const codeIndex = cleaned.indexOf(code);
  const fromCode = codeIndex >= 0 ? cleaned.slice(codeIndex) : cleaned;
  const displayPlate = formatPlateDisplay(fromCode);

  if(!info){
    if(!silent){
      setStatus('');
      plateTextEl.textContent = displayPlate || fromCode;
      showError(`"${code}" geçerli bir il kodu değil (geçerli aralık 01–81).`);
    }
    return false;
  }

  plateTextEl.textContent = displayPlate || fromCode;
  setStatus(fromOcr ? 'Okundu.' : '');
  showProvince(code, info[0], info[1]);
  return true;
}

function formatPlateDisplay(cleaned){
  const m = cleaned.match(/^(\d{2})([A-Z]{1,3})(\d{2,4})$/);
  if(m) return `${m[1]} ${m[2]} ${m[3]}`;
  return cleaned;
}

function showProvince(code, name, region){
  resultInner.innerHTML = `
    <div class="province-block">
      <div class="province-code">${code}</div>
      <div>
        <div class="province-name">${name}</div>
        <div class="province-region">${region} Bölgesi</div>
      </div>
    </div>
  `;
  resultEl.classList.add('show');
}

function showError(msg){
  resultInner.innerHTML = `<div class="error-block">${msg}</div>`;
  resultEl.classList.add('show');
}
</script>
</body>
</html>
